<a class="skip-link" href="#contenido">Saltar al contenido</a>

<div class="shell" [class.shell--drawer-open]="drawerOpen()">
  <!-- Sidebar / Drawer -->
  <aside class="sidebar" [attr.aria-hidden]="null">
    <div class="brand">
      <ng-icon class="brand__mark" name="lucideStore" aria-hidden="true" />
      <span class="brand__name">SmartBusiness<span>IA</span></span>
    </div>

    <nav class="nav" aria-label="Navegación principal">
      <ul>
        @for (item of nav(); track item.link) {
          <li>
            <a
              [routerLink]="item.link"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: false }"
              (click)="closeDrawer()"
              [attr.aria-keyshortcuts]="'Alt+' + item.atajo"
              [title]="item.label + ' (Alt+' + item.atajo + ')'"
            >
              <ng-icon class="nav__icon" [name]="item.icon" aria-hidden="true" />
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="sidebar__foot">
      <a routerLink="/negocios" (click)="cambiarNegocio(); closeDrawer()" class="switch-biz">
        <ng-icon name="lucideArrowLeftRight" aria-hidden="true" /> Cambiar de negocio
      </a>
    </div>
  </aside>

  <!-- Backdrop (solo móvil con drawer abierto) -->
  <button
    type="button"
    class="backdrop"
    aria-label="Cerrar menú"
    (click)="closeDrawer()"
  ></button>

  <!-- Área principal -->
  <div class="main">
    <header class="topbar">
      <button
        type="button"
        class="icon-btn hamburger"
        (click)="toggleDrawer()"
        [attr.aria-expanded]="drawerOpen()"
        aria-label="Abrir menú de navegación"
      >
        <span></span><span></span><span></span>
      </button>

      <div class="topbar__biz">
        <strong>{{ negocio()?.nombre }}</strong>
        <span class="badge badge--primary">{{ tipoLabel() }}</span>
      </div>

      <div class="topbar__actions">
        <a
          routerLink="/app/ventas/nueva"
          class="btn btn--secondary btn--sm quick-sale"
          aria-keyshortcuts="N"
          title="Nueva venta (N)"
        >
          <ng-icon name="lucidePlus" aria-hidden="true" />
          <span class="quick-sale__label">Nueva venta</span>
        </a>
        <app-theme-toggle />
        <button
          type="button"
          class="icon-btn help-btn"
          (click)="ayudaOpen.set(true)"
          aria-label="Ayuda y atajos de teclado"
          aria-keyshortcuts="Shift+?"
          title="Ayuda y atajos de teclado (?)"
        >
          <ng-icon name="lucideCircleHelp" aria-hidden="true" />
        </button>
      </div>

      <div class="topbar__user" #userBox>
        <button
          type="button"
          class="user-btn"
          (click)="toggleUserMenu()"
          [attr.aria-expanded]="userMenuOpen()"
          aria-haspopup="menu"
        >
          <span class="avatar" aria-hidden="true">{{ (usuario()?.nombre || '?')[0] }}</span>
          <span class="user-btn__id">
            <span class="user-btn__name">{{ usuario()?.nombre }}</span>
            <span class="user-btn__role">{{ negocio()?.rolUsuario === 'DUENO' ? 'Dueño' : 'Empleado' }}</span>
          </span>
          <ng-icon name="lucideChevronDown" aria-hidden="true" />
        </button>
        @if (userMenuOpen()) {
          <div class="user-menu" role="menu">
            <p class="user-menu__email">{{ usuario()?.email }}</p>
            <a routerLink="/app/cuenta" role="menuitem" class="user-menu__item" (click)="userMenuOpen.set(false)">
              <ng-icon name="lucideKeyRound" aria-hidden="true" /> Mi cuenta y contraseña
            </a>
            <button type="button" role="menuitem" (click)="logout()">
              <ng-icon name="lucideLogOut" aria-hidden="true" /> Cerrar sesión
            </button>
          </div>
        }
      </div>
    </header>

    <main id="contenido" class="content" tabindex="-1">
      <div class="container">
        <router-outlet />
      </div>
    </main>
  </div>
</div>

<app-shortcuts-help [(open)]="ayudaOpen" />
